name: Java tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application and tests
        run: |
          mkdir -p build
          javac -d build Train_App/src/TrainConsist.java Train_App/src/TrainManagementApp.java Train_App/test/TrainConsistTest.java
      - name: Run tests
        run: java -cp build TrainConsistTest
